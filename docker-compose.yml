# PixelFlow 一键演示环境：mysql → api(ready) → web。
# 使用方式：
#   cp .env.example .env    # Windows: copy .env.example .env
#   docker compose up --build
# 浏览器访问 http://localhost:3000 。浏览器只与 web 通信，/api/v1/** 由 web 转发到 api。
# 停止用 docker compose down（不要加 -v：卷里是数据库与用户素材）。
name: pixelflow

services:
  mysql:
    image: mysql:8.4.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pixelflow-root-demo-only}
      MYSQL_DATABASE: ${DB_NAME:-pixelflow}
      MYSQL_USER: ${DB_USER:-pixelflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pixelflow-demo-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pixelflow}
      DB_USER: ${DB_USER:-pixelflow}
      DB_PASSWORD: ${DB_PASSWORD:-pixelflow-demo-only}
      SERVER_PORT: 8080
      STORAGE_ROOT: /data/storage
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      STAGE_DELAY_ASSET_CHECK_MS: ${STAGE_DELAY_ASSET_CHECK_MS:-2000}
      STAGE_DELAY_GENERATE_MS: ${STAGE_DELAY_GENERATE_MS:-2000}
      STAGE_DELAY_FINALIZE_MS: ${STAGE_DELAY_FINALIZE_MS:-2000}
      WORKER_FIXED_DELAY_MS: ${WORKER_FIXED_DELAY_MS:-500}
    volumes:
      - api-storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # readiness 组包含 db 与 startupRecoveryState：数据库连通且启动收尾完成后才算健康。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        JAVA_API_ORIGIN: http://api:8080
    environment:
      JAVA_API_ORIGIN: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  api-storage:
