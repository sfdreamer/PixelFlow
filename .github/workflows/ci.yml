# 交付基线要求的 CI：push 与 pull_request 都触发，前端与后端各自独立。
# 两个 job 都不依赖对方，任何一端失败都会阻断交付。
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint 走独立 CLI，不依赖 Next 的 lint 子命令。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test -- --run

      # 前端构建不需要 API 在线：页面数据全部在运行期加载。
      - name: Build
        run: npm run build

  backend:
    name: backend (unit + integration + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: pixelflow_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-ci-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      # 集成测试使用隔离库 pixelflow_it；不使用 H2 替代，真实校验事务、Mapper 与约束。
      PF_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/pixelflow_it?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      PF_TEST_MYSQL_USER: root
      PF_TEST_MYSQL_PASSWORD: root-ci-only
      PF_TEST_STORAGE: target/test-storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # verify 会跑 surefire 单测、failsafe 集成测试，并打出可运行 jar。
      - name: Verify
        run: ./mvnw -B verify
